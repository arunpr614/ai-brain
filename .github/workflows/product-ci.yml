name: Product CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      known_good_ref:
        description: "Optional prior main commit to package as an audited additive-migration rollback runtime"
        required: false
        type: string

permissions:
  contents: read

jobs:
  stage2_native_nominal:
    name: Stage 2 native nominal proof
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Select and attest exact Apple Command Line Tools
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          test "$(xcode-select --print-path)" = /Library/Developer/CommandLineTools
          test "$(/usr/bin/clang++ --version | sed -n '1p')" = \
            "Apple clang version 21.0.0 (clang-2100.1.1.101)"
      - name: Materialize pinned Node runtime
        run: |
          set -euo pipefail
          pinned_root=/opt/homebrew/Cellar/node@22/22.22.3
          archive="$RUNNER_TEMP/node-v22.22.3-darwin-arm64.tar.gz"
          expected=0da7ff74ef8611328c8212f17943368713a2ad953fb7d89a8c8a0eae87c23207
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test ! -e "$pinned_root"
          curl --fail --silent --show-error --location \
            https://nodejs.org/dist/v22.22.3/node-v22.22.3-darwin-arm64.tar.gz \
            --output "$archive"
          actual="$(shasum -a 256 "$archive" | awk '{ print $1 }')"
          test "$actual" = "$expected"
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" "$pinned_root"
          tar -xzf "$archive" --strip-components=1 -C "$pinned_root"
          unlink "$archive"
          test "$(realpath "$pinned_root/bin/node")" = "$pinned_root/bin/node"
          test "$("$pinned_root/bin/node" -p 'process.versions.node')" = 22.22.3
          test "$("$pinned_root/bin/node" -p 'process.versions.modules')" = 127
          test "$(shasum -a 256 "$pinned_root/include/node/node.h" | awk '{ print $1 }')" = \
            bc47b118a731e9663b145e4823ebc7f31237140d6ea95417519d894d7a0498cb
          test "$(shasum -a 256 "$pinned_root/include/node/node_version.h" | awk '{ print $1 }')" = \
            8398c745f56d8f522ee1575321f3cec20e4c065d62dd28c7f586d2ced7d1cf41
      - name: Locked install with pinned Node
        run: |
          pinned_root=/opt/homebrew/Cellar/node@22/22.22.3
          export PATH="$pinned_root/bin:$PATH"
          test "$(command -v node)" = "$pinned_root/bin/node"
          test "$(node -p 'process.versions.node')" = 22.22.3
          test "$(node -p 'process.versions.modules')" = 127
          "$pinned_root/bin/node" \
            "$pinned_root/lib/node_modules/npm/bin/npm-cli.js" ci
      - name: Disposable Stage 2 nominal native proofs
        env:
          NODE_ENV: test
        run: |
          pinned_root=/opt/homebrew/Cellar/node@22/22.22.3
          "$pinned_root/bin/node" \
            scripts/run-product-test-suite.mjs stage2-native-nominal

  verify:
    if: ${{ always() }}
    needs: stage2_native_nominal
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require successful Stage 2 nominal native proof
        env:
          STAGE2_NATIVE_NOMINAL_RESULT: ${{ needs.stage2_native_nominal.result }}
        run: test "$STAGE2_NATIVE_NOMINAL_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Locked extension install
        run: npm ci --prefix extension
      - name: Static verification
        run: npm run typecheck && npm run lint && npm run check:env
      - name: Chrome extension verification
        run: npm run check --prefix extension
      - name: Product tests
        run: npm test
      - name: Documentation privacy and structure
        run: npm run smoke:agent-docs && npm run check:agent-docs
      - name: Build production operator tools
        run: npm run build:vector-tools && npm run build:processing-tools
      - name: Production build
        run: npm run build && npm run check:build-artifacts
      - name: Release-tool smoke tests
        run: npm run smoke:processing-readiness && npm run smoke:release-artifact

  package-main-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Locked extension install
        run: npm ci --prefix extension
      - name: Verify and build Chrome extension
        run: npm run check --prefix extension
      - name: Build immutable Linux runtime
        run: npm run build:vector-tools && npm run build:processing-tools && npm run build && npm run check:build-artifacts
      - name: Package immutable Linux release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          created_at="$(git show -s --format=%cI HEAD)"
          npm run release:artifact -- \
            --output release-artifacts \
            --sha "$RELEASE_SHA" \
            --builder-sha "$RELEASE_SHA" \
            --created-at "$created_at" \
            --extension-dist extension/dist
      - name: Attest immutable release provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release-artifacts/*
      - name: Upload immutable release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-brain-release-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  package-known-good:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.known_good_ref != '' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tools from main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: tools
      - name: Checkout known-good application
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.known_good_ref }}
          fetch-depth: 0
          path: known-good
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/package-lock.json
            known-good/package-lock.json
      - name: Resolve and authorize known-good commit
        id: known-good
        run: |
          git -C known-good fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          resolved_sha="$(git -C known-good rev-parse HEAD)"
          git -C known-good merge-base --is-ancestor "$resolved_sha" origin/main
          printf 'sha=%s\n' "$resolved_sha" >> "$GITHUB_OUTPUT"
      - name: Restore historical production migration identity
        run: |
          expected=e6185834406c6da4596d4af514cf9c97737b125ba8554fe0012506e3e1b377cf
          actual="$(sha256sum tools/src/db/migrations/018_topics.sql | cut -d' ' -f1)"
          test "$actual" = "$expected"
          install -m 0644 tools/src/db/migrations/018_topics.sql known-good/src/db/migrations/018_topics.sql
      - name: Build known-good Linux runtime
        working-directory: known-good
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build:vector-tools && npm run build && npm run check:build-artifacts
      - name: Build current release tools
        working-directory: tools
        run: npm ci && npm run build:processing-tools
      - name: Package known-good rollback artifact
        env:
          BUILDER_SHA: ${{ github.sha }}
          RESOLVED_SHA: ${{ steps.known-good.outputs.sha }}
        run: |
          created_at="$(git -C known-good show -s --format=%cI HEAD)"
          node tools/scripts/build-release-artifact.mjs \
            --root known-good \
            --tools-root tools \
            --output known-good-artifacts \
            --sha "$RESOLVED_SHA" \
            --builder-sha "$BUILDER_SHA" \
            --created-at "$created_at"
      - name: Attest known-good provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: known-good-artifacts/*
      - name: Upload known-good rollback artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-brain-known-good-${{ steps.known-good.outputs.sha }}
          path: known-good-artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
